name: clickstack

services:
  clickstack:
    image: clickhouse/clickstack-local:latest
    container_name: clickstack-local
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8123:8123"
      - "9002:9000"
      - "4317:4317"
      - "4318:4318"
    environment:
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - ./docker/clickhouse/users.d/allow-external.xml:/etc/clickhouse-server/users.d/allow-external.xml
      - ./docker/clickhouse/initdb.d:/docker-entrypoint-initdb.d
      - clickstack_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 4s
      timeout: 3s
      retries: 15

volumes:
  clickstack_data:
