name: clickstack

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickstack-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      # Port 9000 (native binary protocol) omitted — MCP uses HTTP only (:8123)
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./docker/clickhouse/initdb.d:/docker-entrypoint-initdb.d
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  clickhouse_data:
